name: Release APK and EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version to build and publish (example: 1.0.0). Required before the workflow starts."
        required: true
        type: string
        default: "1.0.0"
      notes:
        description: "Release notes shown on GitHub Releases and in the in-app updater"
        required: false
        type: string
        default: ""
      prerelease:
        description: "Mark this GitHub Release as a pre-release"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.27.4"
  JAVA_VERSION: "17"
  AETHER_TAG: "v2.0.0"
  HEV_TAG: "2.17.1"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      notes: ${{ steps.v.outputs.notes }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_NOTES: ${{ github.event.inputs.notes }}
          INPUT_PRE: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${INPUT_VERSION:-}"
            NOTES="${INPUT_NOTES:-}"
            PRE="${INPUT_PRE:-false}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            NOTES=""
            PRE="false"
          fi
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.0.0 (got '$VERSION')"
            exit 1
          fi
          {
            echo "version=${VERSION}"
            echo "prerelease=${PRE}"
            echo "notes<<EOF"
            echo "${NOTES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Building Nimbus VPN v${VERSION}"

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;27.0.12077973"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Stamp version
        run: python3 scripts/stamp_version.py "${{ needs.version.outputs.version }}"
      - name: Scaffold Android platform
        run: flutter create . --project-name nimbus --org pm.dnschanger --platforms=android
      - name: Apply overlays
        run: python3 scripts/apply_overlays.py
      - name: Fetch Aether Android cores
        run: bash scripts/fetch_cores.sh android
      - name: Build HEV JNI
        run: bash scripts/build_hev.sh
      - run: flutter pub get
      - name: Build APKs (universal + per-ABI)
        env:
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            mkdir -p android/.android-signing
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/.android-signing/nimbus.jks
            export ANDROID_KEYSTORE_PATH="$GITHUB_WORKSPACE/android/.android-signing/nimbus.jks"
          fi
          VER="${{ needs.version.outputs.version }}"
          flutter build apk --release \
            --target-platform android-arm,android-arm64,android-x64 \
            --dart-define=NIMBUS_VERSION=$VER
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64,android-x64 \
            --dart-define=NIMBUS_VERSION=$VER
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk \
            "release/Nimbus-VPN-v${VER}-Android-Universal.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            "release/Nimbus-VPN-v${VER}-Android-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "release/Nimbus-VPN-v${VER}-Android-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
            "release/Nimbus-VPN-v${VER}-Android-x86_64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release/*.apk

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Stamp version
        run: python scripts/stamp_version.py "${{ needs.version.outputs.version }}"
      - name: Scaffold Windows platform
        run: flutter create . --project-name nimbus --org pm.dnschanger --platforms=windows
      - name: Apply overlays
        run: python scripts/apply_overlays.py
      - name: Fetch Aether Windows core
        shell: bash
        run: bash scripts/fetch_cores.sh windows
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=NIMBUS_VERSION=${{ needs.version.outputs.version }}
      - name: Stage sidecars
        shell: pwsh
        run: |
          $out = "build\windows\x64\runner\Release"
          if (-not (Test-Path $out)) { $out = "build\windows\runner\Release" }
          Copy-Item third_party\windows\* $out -Force
          New-Item -ItemType Directory -Force release | Out-Null
          $ver = "${{ needs.version.outputs.version }}"
          Compress-Archive -Path "$out\*" -DestinationPath "release\Nimbus-VPN-v$ver-Windows-x64-Portable.zip" -Force
          echo "OUT=$out" >> $env:GITHUB_ENV
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $ver = "${{ needs.version.outputs.version }}"
          $out = $env:OUT
          & $iscc "/DMyAppVersion=$ver" "/DBuildDir=$out" scripts\nimbus.iss
          Get-ChildItem release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            release/*.exe
            release/*.zip

  publish:
    needs: [version, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Checksums and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES_BODY: ${{ needs.version.outputs.notes }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          TAG="v${VERSION}"
          PRE="${{ needs.version.outputs.prerelease }}"
          mkdir -p release
          find dist -type f \( -name '*.apk' -o -name '*.exe' -o -name '*.zip' \) -exec cp {} release/ \;
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release
          USER_NOTES="${NOTES_BODY:-}"
          NOTES=$(cat <<EOF
          ## Nimbus VPN v${VERSION}

          Independent Flutter client for [CluvexStudio/Aether](https://github.com/CluvexStudio/Aether) **${AETHER_TAG}**.

          ${USER_NOTES}

          ### Downloads
          - \`Nimbus-VPN-v${VERSION}-Android-Universal.apk\` — Android 7.0 (API 24) and newer (all ABIs)
          - \`Nimbus-VPN-v${VERSION}-Android-arm64-v8a.apk\` — 64-bit ARM (most phones)
          - \`Nimbus-VPN-v${VERSION}-Android-armeabi-v7a.apk\` — 32-bit ARM
          - \`Nimbus-VPN-v${VERSION}-Android-x86_64.apk\` — 64-bit x86 emulators
          - \`Nimbus-VPN-v${VERSION}-Windows-x64-Installer.exe\` — Windows 8.1 through 11 (x64)
          - \`Nimbus-VPN-v${VERSION}-Windows-x64-Portable.zip\` — portable Windows build

          The in-app updater reads this GitHub Release.

          EOF
          )
          PREFLAG=()
          if [[ "$PRE" == "true" ]]; then PREFLAG=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --title "Nimbus VPN v${VERSION}" --notes "$NOTES" ${PREFLAG[@]+"${PREFLAG[@]}"}
          else
            gh release create "$TAG" release/* --title "Nimbus VPN v${VERSION}" --notes "$NOTES" ${PREFLAG[@]+"${PREFLAG[@]}"}
          fi
