name: Release APK and EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.27.4"
  JAVA_VERSION: "17"
  AETHER_TAG: "v2.0.0"
  HEV_TAG: "2.17.1"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;27.0.12077973"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Scaffold Android platform
        run: flutter create . --project-name nimbus --org pm.dnschanger --platforms=android
      - name: Apply overlays
        run: python3 scripts/apply_overlays.py
      - name: Fetch Aether Android cores
        run: bash scripts/fetch_cores.sh android
      - name: Build HEV JNI
        run: bash scripts/build_hev.sh
      - run: flutter pub get
      - name: Build universal APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            mkdir -p android/.android-signing
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/.android-signing/nimbus.jks
            export ANDROID_KEYSTORE_PATH="$GITHUB_WORKSPACE/android/.android-signing/nimbus.jks"
          fi
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk \
            "release/Nimbus-VPN-v${{ needs.version.outputs.version }}-Android-Universal.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release/*.apk

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Scaffold Windows platform
        run: flutter create . --project-name nimbus --org pm.dnschanger --platforms=windows
      - name: Apply overlays
        run: python scripts/apply_overlays.py
      - name: Fetch Aether Windows core
        shell: bash
        run: bash scripts/fetch_cores.sh windows
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Stage sidecars
        shell: pwsh
        run: |
          $out = "build\windows\x64\runner\Release"
          if (-not (Test-Path $out)) { $out = "build\windows\runner\Release" }
          Copy-Item third_party\windows\* $out -Force
          New-Item -ItemType Directory -Force release | Out-Null
          echo "OUT=$out" >> $env:GITHUB_ENV
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $ver = "${{ needs.version.outputs.version }}"
          $out = $env:OUT
          & $iscc "/DMyAppVersion=$ver" "/DBuildDir=$out" scripts\nimbus.iss
          Get-ChildItem release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: release/*.exe

  publish:
    needs: [version, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Checksums and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          TAG="v${VERSION}"
          mkdir -p release
          find dist -type f \( -name '*.apk' -o -name '*.exe' \) -exec cp {} release/ \;
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release
          NOTES=$(cat <<EOF
          ## Nimbus VPN v${VERSION}

          Independent Flutter client for [CluvexStudio/Aether](https://github.com/CluvexStudio/Aether) **${AETHER_TAG}**.

          ### Downloads
          - \`Nimbus-VPN-v${VERSION}-Android-Universal.apk\` — Android 7.0 (API 24) and newer
          - \`Nimbus-VPN-v${VERSION}-Windows-x64-Installer.exe\` — Windows 8.1 through 11 (x64)

          In-app updates read this GitHub Releases endpoint.

          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --title "Nimbus VPN v${VERSION}" --notes "$NOTES"
          fi
